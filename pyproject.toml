[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corporatetravel-dispatch-mcp"
version = "0.1.0"
description = "MCP server exposing CS Executive Services dispatch platform tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    # jsonschema is imported unconditionally by mcp/server/lowlevel/server.py
    # (tool input validation) but is not a declared dependency of the mcp
    # package and the mcp[cli] extra does not reliably pull it in. Without it
    # the server crashes at import time (observed 2026-08-11 bringing up
    # corporatetraveldc-mcpo-public.service). Declare it explicitly.
    "jsonschema>=4.0.0",
]

[project.scripts]
dispatch-mcp = "dispatch_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["dispatch_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
